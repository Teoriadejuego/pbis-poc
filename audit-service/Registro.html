<!doctype html><html lang="es"><meta charset="utf-8"><style>body{font:15px system-ui;padding:16px;color:#183e64}textarea{width:100%;box-sizing:border-box;height:190px}button{padding:10px 18px;margin-top:12px}#status{white-space:pre-wrap}</style><p>Pega el contenido del manifiesto JSON descargado al generar el proyecto. Incluye códigos, DNI parcial y hashes de escritura; no contiene los datos del alumnado ni sus contraseñas.</p><textarea id="manifest" aria-label="Manifiesto de registro" spellcheck="false"></textarea><button id="register">Registrar proyecto</button><p id="status" role="status"></p><script>document.getElementById('register').onclick=function(){const button=this;button.disabled=true;document.getElementById('status').textContent='Registrando…';google.script.run.withSuccessHandler(message=>{document.getElementById('status').textContent=message;button.disabled=false;}).withFailureHandler(error=>{document.getElementById('status').textContent=error.message;button.disabled=false;}).registerProjectFromJson(document.getElementById('manifest').value);};</script></html>
