name: Publicar PBIS en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir y comprobar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dirección pública compartida por la construcción y sus pruebas.
      PBIS_BATCH_ENDPOINT: 'https://formspree.io/f/mvkgydrn'
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Instalar herramientas de comprobación
        run: npm ci --ignore-scripts
      - name: Instalar navegador para pruebas
        run: npx playwright install --with-deps chromium
      - name: Construir el sitio
        run: npm run build
      - name: Ejecutar todas las pruebas
        run: npm test
      - name: Comprobar importación local del feedback
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Probar los recorridos en navegador
        run: npm run test:e2e
      - name: Probar acceso unificado y proyectos cifrados
        run: node tests/e2e/protected.mjs
      - name: Comprobar el contenido permitido de la publicación
        run: npm run verify:release
      - name: Guardar resultados del navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprobaciones-navegador
          path: test-results/
          if-no-files-found: ignore
      - name: Preparar únicamente el sitio público
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publicar
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar el sitio comprobado
        id: deployment
        uses: actions/deploy-pages@v4
