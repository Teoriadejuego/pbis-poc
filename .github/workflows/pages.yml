name: Publicar PBIS en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir y comprobar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Construir el sitio
        run: npm run build
        env:
          # El piloto no envía opiniones a un servicio externo.
          FEEDBACK_ENDPOINT: ''
      - name: Ejecutar todas las pruebas
        run: npm test
      - name: Preparar únicamente el sitio público
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publicar
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar el sitio comprobado
        id: deployment
        uses: actions/deploy-pages@v4
